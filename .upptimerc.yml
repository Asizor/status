owner: Asizor
repo: status
user-agent: asizor-status (+https://status.asizor.com)

sites:
  - name: API
    slug: api
    url: https://api.asizor.com/health/ready
    expectedStatusCodes: [200]
    maxResponseTime: 10000
  - name: Website
    slug: website
    url: https://asizor.com
    expectedStatusCodes: [200]
    maxResponseTime: 10000

assignees:
  - Lancelittle

status-website:
  cname: status.asizor.com
  name: asizor
  logoUrl: https://status.asizor.com/asizor-mark-on-dark.svg
  favicon: https://status.asizor.com/favicon.svg
  themeUrl: https://status.asizor.com/asizor-theme.css
  introTitle: "asizor service status"
  introMessage: "We check the asizor API and website from outside our own infrastructure about every 5 minutes. When a check fails, an incident opens here automatically, and updates are posted to it until it is resolved."
  navbar:
    - title: Status
      href: /
    - title: asizor.com
      href: https://asizor.com

workflowSchedule:
  uptime: "*/5 * * * *"
